name: Convert Playlist

on:
  schedule:
    - cron: '0 */6 * * *'  # runs every 6 hours
  workflow_dispatch:      # allows manual run

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch
        run: |
          curl -L -A "Mozilla/5.0" "https://raw.githubusercontent.com/aiemas/Mia/refs/heads/main/sportzonline_lista.html" -o index.html

      - name: Check if file is empty
        run: |
          if [ -s index.html ]; then
            echo "File downloaded successfully."
          else
            echo "File is empty! Check URL or credentials."
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update playlist" && git push)
