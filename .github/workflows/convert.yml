name: Convert Playlist

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch playlist content and update Lol.m3u
        run: |
          curl -L "https://raw.githubusercontent.com/aiemas/Mia/refs/heads/main/sportzonline_lista.html" -o index.html
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "Convert index.html from sportzonline_lista" || echo "No changes to commit"
          git pull --rebase origin main
          git push
