<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Sports — Glass UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-0: #07060f;
    --bg-1: #0d0a1f;
    --glass-bg: rgba(255, 255, 255, 0.06);
    --glass-bg-strong: rgba(255, 255, 255, 0.10);
    --glass-border: rgba(255, 255, 255, 0.14);
    --glass-border-strong: rgba(255, 255, 255, 0.22);
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.68);
    --text-faint: rgba(255, 255, 255, 0.45);
    --accent-1: #7c3aed;
    --accent-2: #ec4899;
    --accent-3: #06b6d4;
    --good: #10b981;
    --warn: #f59e0b;
    --bad:  #ef4444;
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    --radius: 20px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: var(--bg-0);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body {
    background:
      radial-gradient(ellipse 800px 600px at 10% 10%, rgba(124, 58, 237, 0.35), transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 20%, rgba(236, 72, 153, 0.25), transparent 60%),
      radial-gradient(ellipse 900px 700px at 50% 100%, rgba(6, 182, 212, 0.25), transparent 60%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1));
    background-attachment: fixed;
    min-height: 100vh;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.15) 0%, transparent 30%),
      radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.12) 0%, transparent 30%);
    filter: blur(40px);
    animation: float 20s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes float {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(30px, -20px) scale(1.05); }
    100% { transform: translate(-20px, 30px) scale(0.98); }
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding:
      calc(24px + var(--tg-safe-area-inset-top, 0px))
      calc(20px + var(--tg-safe-area-inset-right, 0px))
      calc(80px + var(--tg-safe-area-inset-bottom, 0px))
      calc(20px + var(--tg-safe-area-inset-left, 0px));
  }

  /* ---------- Header ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.02em;
  }

  .brand-mark {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    display: grid;
    place-items: center;
    box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
  }
  .brand-mark svg { width: 22px; height: 22px; }

  .brand-text {
    background: linear-gradient(90deg, #fff, #c4b5fd);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .topbar-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .live-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.35);
    color: #fecaca;
    font-size: 12px;
    font-weight: 600;
    backdrop-filter: blur(10px);
  }
  .live-pill .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ef4444;
    box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
    animation: pulse 1.6s infinite;
  }

  .clock-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    backdrop-filter: blur(10px);
  }
  .clock-pill .utc {
    color: var(--text-faint);
    font-weight: 500;
    font-size: 11px;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
    70%  { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
    100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
  }

  .glass-btn {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: inherit;
  }
  .glass-btn:hover {
    background: var(--glass-bg-strong);
    border-color: var(--glass-border-strong);
    transform: translateY(-1px);
  }
  .glass-btn:active { transform: translateY(0); }
  .glass-btn svg { width: 16px; height: 16px; }

  /* ---------- Section tabs ---------- */
  .section-tabs {
    display: flex;
    gap: 6px;
    padding: 4px;
    margin-bottom: 24px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    backdrop-filter: blur(14px);
    width: fit-content;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .section-tab {
    padding: 8px 16px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .section-tab:hover { color: var(--text); background: var(--glass-bg-strong); }
  .section-tab.active {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: #fff;
    box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
  }

  /* ---------- Search bar ---------- */
  .search-wrap {
    position: relative;
    margin-bottom: 24px;
  }
  .search-wrap svg {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    color: var(--text-faint);
    pointer-events: none;
  }
  .search {
    width: 100%;
    padding: 16px 18px 16px 48px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    color: var(--text);
    border-radius: 16px;
    font-size: 15px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: all 0.2s;
    font-family: inherit;
  }
  .search::placeholder { color: var(--text-faint); }
  .search:focus {
    outline: none;
    border-color: var(--glass-border-strong);
    background: var(--glass-bg-strong);
  }

  .filter-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
  }
  .chip {
    padding: 7px 14px;
    border-radius: 999px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
    font-family: inherit;
  }
  .chip:hover { color: var(--text); }
  .chip.active {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 16px rgba(124, 58, 237, 0.4);
  }

  /* ---------- Event grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 18px;
  }

  .event-card {
    position: relative;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: var(--shadow);
  }
  .event-card:hover {
    transform: translateY(-4px);
    border-color: var(--glass-border-strong);
    background: var(--glass-bg-strong);
  }

  .event-banner {
    aspect-ratio: 16 / 9;
    background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(236,72,153,0.3));
    position: relative;
    overflow: hidden;
  }
  .event-banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .event-banner-fallback {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: rgba(255,255,255,0.4);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.05em;
  }
  .event-card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
  }
  .cat-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 5px 10px;
    border-radius: 8px;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .formats-count {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 5px 10px;
    border-radius: 8px;
    background: rgba(124, 58, 237, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    font-size: 11px;
    font-weight: 600;
  }

  /* Status badge — stacked below the category badge on the banner */
  .status-badge {
    position: absolute;
    top: 44px;
    left: 12px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px;
    border-radius: 8px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .status-badge.live {
    background: rgba(239, 68, 68, 0.85);
    border-color: rgba(239, 68, 68, 0.5);
    color: #fff;
  }
  .status-badge.live .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #fff;
    animation: pulse 1.4s infinite;
  }
  .status-badge.soon {
    background: rgba(245, 158, 11, 0.85);
    border-color: rgba(245, 158, 11, 0.5);
    color: #fff;
  }
  .status-badge.upcoming {
    background: rgba(34, 211, 238, 0.75);
    border-color: rgba(34, 211, 238, 0.4);
    color: #042f3a;
  }
  .status-badge.recent {
    background: rgba(168, 85, 247, 0.75);
    border-color: rgba(168, 85, 247, 0.4);
    color: #fff;
  }
  .status-badge.ended {
    background: rgba(75, 85, 99, 0.75);
    border-color: rgba(75, 85, 99, 0.4);
    color: #e5e7eb;
  }

  .event-body {
    padding: 16px 18px 18px;
  }
  .event-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
    line-height: 1.3;
  }
  .event-name {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 12px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .matchup {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .team {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .team img {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
    background: rgba(255,255,255,0.1);
    flex-shrink: 0;
  }
  .team-name {
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .vs {
    font-size: 11px;
    color: var(--text-faint);
    font-weight: 600;
  }
  .event-time {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-faint);
  }
  .event-time svg { width: 13px; height: 13px; }
  .event-time .t-live { color: #fca5a5; font-weight: 600; }
  .event-time .t-soon { color: #fcd34d; font-weight: 600; }
  .event-time .t-recent { color: #d8b4fe; font-weight: 600; }
  .event-time .t-ended { color: #9ca3af; }

  .status-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    margin-bottom: 4px;
  }
  .status-row .chip { flex: 0 0 auto; }

  /* ---------- Detail page ---------- */
  .back-btn {
    margin-bottom: 20px;
  }

  .detail-header {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 24px;
    backdrop-filter: blur(20px);
    box-shadow: var(--shadow);
  }
  .detail-banner {
    aspect-ratio: 21 / 9;
    background: linear-gradient(135deg, rgba(124,58,237,0.4), rgba(236,72,153,0.4));
    position: relative;
    overflow: hidden;
  }
  .detail-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail-banner-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 30%, rgba(0,0,0,0.7) 100%);
    display: flex;
    align-items: flex-end;
    padding: 24px;
  }
  .detail-banner-content { width: 100%; }
  .detail-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(24px, 4vw, 36px);
    font-weight: 700;
    margin-bottom: 4px;
    line-height: 1.1;
  }
  .detail-subtitle {
    color: var(--text-dim);
    font-size: 15px;
  }

  .detail-body { padding: 24px; }
  .detail-meta {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .meta-item {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
  }
  .meta-label {
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .meta-value { font-size: 14px; font-weight: 600; }

  .viewer-count-meta { border-color: rgba(52, 211, 153, 0.3); background: rgba(52, 211, 153, 0.08); }
  .viewer-count-meta .meta-label { display: flex; align-items: center; gap: 5px; color: rgba(52, 211, 153, 0.7); }
  .viewer-count-meta .meta-label svg { width: 13px; height: 13px; }
  .viewer-count-value { color: #34d399; font-size: 18px !important; font-weight: 700 !important; }

  .section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 700;
    margin: 32px 0 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title .count {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }

  .stream-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
  }

  .stream-item {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    gap: 0;
    cursor: pointer;
    overflow: hidden;
  }
  .stream-item:hover {
    background: var(--glass-bg-strong);
    border-color: var(--glass-border-strong);
  }
  .stream-item.open {
    background: var(--glass-bg-strong);
    border-color: var(--glass-border-strong);
  }

  .stream-head {
    display: flex;
    align-items: center;
    gap: 12px;
    user-select: none;
  }
  .stream-logo {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: rgba(255,255,255,0.08);
    display: grid;
    place-items: center;
    flex-shrink: 0;
    overflow: hidden;
  }
  .stream-logo img { width: 100%; height: 100%; object-fit: cover; }
  .stream-logo-fallback {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-dim);
  }
  .stream-info { flex: 1; min-width: 0; }
  .stream-title {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stream-url {
    font-size: 11px;
    color: var(--text-faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  }
  .type-badge {
    padding: 4px 9px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    flex-shrink: 0;
  }
  .type-0 { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
  .type-1 { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245,158,11,0.3); }
  .type-2 { background: rgba(168, 85, 247, 0.15); color: #d8b4fe; border: 1px solid rgba(168,85,247,0.3); }
  .type-3 { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }

  .expand-icon {
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    color: var(--text-faint);
    transition: transform 0.25s ease;
    flex-shrink: 0;
  }
  .expand-icon svg { width: 16px; height: 16px; }
  .stream-item.open .expand-icon { transform: rotate(180deg); color: var(--text); }

  .stream-details {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.3s ease;
  }
  .stream-details-inner {
    overflow: hidden;
    min-height: 0;
  }
  .stream-item.open .stream-details { grid-template-rows: 1fr; }

  .stream-details-content {
    padding-top: 14px;
    margin-top: 14px;
    border-top: 1px solid var(--glass-border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .field-label svg { width: 12px; height: 12px; }
  .field-label .required {
    color: var(--accent-2);
    font-size: 9px;
    padding: 2px 5px;
    background: rgba(236, 72, 153, 0.15);
    border-radius: 4px;
    text-transform: none;
    letter-spacing: 0;
  }
  .field-row {
    display: flex;
    align-items: stretch;
    gap: 6px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    overflow: hidden;
  }
  .field-value {
    flex: 1;
    padding: 9px 12px;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 12px;
    color: #e5e7eb;
    word-break: break-all;
    line-height: 1.4;
    min-width: 0;
    max-height: 140px;
    overflow-y: auto;
  }
  .field-copy {
    padding: 0 12px;
    background: var(--glass-bg);
    border: none;
    border-left: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .field-copy:hover {
    background: var(--glass-bg-strong);
    color: var(--text);
  }
  .field-copy.copied { color: var(--good); }
  .field-copy svg { width: 14px; height: 14px; }

  .field-unlock {
    padding: 0 12px;

   *   eventInfo.startTime / endTime
   *   event.startTime / endTime
   *   eventInfo.date + eventInfo.time  (combined as "YYYY-MM-DD HH:MM:SS")
   *   event.date + event.time
   *   event.date / event.time alone
   *   eventInfo.scheduledStart / scheduledEnd
   *   startISO / endISO
   *
   * If only a start is found, the end is estimated as start + 3h
   * (typical for sports events) so the event still gets categorized.
   */
  const extractTimes = (e) => {
    if (!e) return { startTime: null, endTime: null };
    const info = e.eventInfo || {};
    const candidates = [e, info];

    const pick = (...keys) => {
      for (const src of candidates) {
        for (const k of keys) {
          if (src && src[k]) return src[k];
        }
      }
      return null;
    };

    const eventDate = pick('date', 'eventDate', 'matchDate', 'day');
    let startTime = pick('startTime', 'start', 'startISO', 'scheduledStart', 'kickoff', 'startsAt');
    let endTime   = pick('endTime',   'end',   'endISO',   'scheduledEnd',   'endsAt');

    startTime = normalizeDateTime(startTime, eventDate);
    endTime = normalizeDateTime(endTime, eventDate);

    // date + time fallback
    if (!startTime) {
      const time = pick('time', 'eventTime', 'matchTime', 'kickoffTime');
      if (eventDate && time) startTime = normalizeDateTime(time, eventDate);
      else if (eventDate) startTime = eventDate;
      else if (time)    startTime = time;
    }

    if (!endTime) {
      const endDate = pick('endDate', 'eventEndDate', 'matchEndDate') || eventDate;
      const endClock = pick('endTimeOnly', 'endClock', 'finishTime', 'eventEndTime', 'matchEndTime');
      if (endDate && endClock) endTime = normalizeDateTime(endClock, endDate);
    }

    // Estimate end if missing
    if (startTime && !endTime) {
      const s = parseTs(startTime);
      if (s) endTime = new Date(s.getTime() + 3 * 60 * 60 * 1000).toISOString();
    }

    return { startTime, endTime };
  };

  const formatTime = (iso) => {
    const d = parseTs(iso);
    if (!d) return iso || '';
    return d.toLocaleString(undefined, {
      month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  };

  // "Today 15:00" / "Tomorrow 15:00" / "Jun 8, 15:00"
  const formatTimeShort = (d) => {
    if (!d) return '';
    const now = new Date();
    const hh = d.getHours().toString().padStart(2, '0');
    const mm = d.getMinutes().toString().padStart(2, '0');
    const sameDay = d.toDateString() === now.toDateString();
    const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
    const isTomorrow = d.toDateString() === tomorrow.toDateString();
    if (sameDay)  return `Today ${hh}:${mm}`;
    if (isTomorrow) return `Tomorrow ${hh}:${mm}`;
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ` ${hh}:${mm}`;
  };

  const formatTimeRange = (start, end) => {
    const s = formatTime(start);
    const e = formatTime(end);
    if (!s && !e) return '';
    if (s && e) return `${s} → ${e}`;
    return s || e;
  };

  /*
   * Status is derived from startTime / endTime and is the single source of
   * truth for filtering, sorting, and display.
   *
   *   live           → now is between start and end
   *   starting-soon  → starts in ≤ 15 minutes
   *   upcoming       → starts in the future
   *   recently-ended → ended ≤ 30 minutes ago
   *   ended          → ended more than 30 minutes ago
   *   unknown        → no usable start/end time
   */
  const getStatus = (e) => {
    const { startTime, endTime } = extractTimes(e);
    const start = parseTs(startTime);
    const end   = parseTs(endTime);
    const now = Date.now();

    if (start && end) {
      if (now < start) {
        const mins = (start - now) / 60000;
        return mins <= 15 ? 'starting-soon' : 'upcoming';
      }
      if (now > end) {
        const mins = (now - end) / 60000;
        return mins <= 30 ? 'recently-ended' : 'ended';
      }
      return 'live';
    }
    if (start) {
      if (now < start) {
        const mins = (start - now) / 60000;
        return mins <= 15 ? 'starting-soon' : 'upcoming';
      }
      return 'live';
    }
    if (end) {
      if (now > end) {
        const mins = (now - end) / 60000;
        return mins <= 30 ? 'recently-ended' : 'ended';
      }
      return 'live';
    }
    return 'unknown';
  };

  // Map a status to a tab-friendly bucket for the status filter.
  const statusBucket = (s) => {
    if (s === 'live') return 'live';
    if (s === 'starting-soon' || s === 'upcoming') return 'upcoming';
    if (s === 'recently-ended' || s === 'ended') return 'ended';
    return 'other';
  };

  // Human label + CSS class for a status.
  const STATUS_META = {
    'live':           { label: 'LIVE',          cls: 'live',     tCls: 't-live' },
    'starting-soon':  { label: 'STARTS SOON',   cls: 'soon',     tCls: 't-soon' },
    'upcoming':       { label: 'UPCOMING',      cls: 'upcoming', tCls: '' },
    'recently-ended': { label: 'RECENT',        cls: 'recent',   tCls: 't-recent' },
    'ended':          { label: 'ENDED',         cls: 'ended',    tCls: 't-ended' },
    'unknown':        { label: '',              cls: '',         tCls: '' },
  };

  // Proximity event helpers — map proximity matchStatus to the main status system
  const getProximityStatus = (ev) => {
    const ms = ev?.event?.matchStatus;
    if (ms === 'live') return 'live';
    if (ms === 'upcoming') return 'upcoming';
    if (ms === 'finished') return 'ended';
    return 'unknown';
  };

  const getProximityStartTime = (ev) => {
    const e = ev?.event;
    if (!e) return null;
    const raw = `${e.date || ''} ${e.time || ''}`.trim();
    if (!raw) return null;
    // date is DD/MM/YYYY
    const parts = raw.split(' ')[0]?.split('/');
    if (parts && parts.length === 3) {
      const iso = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}T${raw.split(' ').slice(1).join(' ') || '00:00:00'}`;
      const d = new Date(iso);
      return isNaN(d.getTime()) ? null : d;
    }
    const d = new Date(raw);
    return isNaN(d.getTime()) ? null : d;
  };

  const getProximityEndTime = (ev) => {
    const e = ev?.event;
    if (!e) return null;
    const raw = `${e.end_date || ''} ${e.end_time || ''}`.trim();
    if (!raw) return null;
    const parts = raw.split(' ')[0]?.split('/');
    if (parts && parts.length === 3) {
      const iso = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}T${raw.split(' ').slice(1).join(' ') || '00:00:00'}`;
      const d = new Date(iso);
      return isNaN(d.getTime()) ? null : d;
    }
    const d = new Date(raw);
    return isNaN(d.getTime()) ? null : d;
  };

  const getProximityTimeStatus = (ev) => {
    const status = getProximityStatus(ev);
    const start = getProximityStartTime(ev);
    const end = getProximityEndTime(ev);
    const now = new Date();

    if (status === 'live' && start) {
      const elapsed = Math.floor((now - start) / 60000);
      if (elapsed < 1)   return { text: 'Just started', cls: 't-live' };
      if (elapsed < 60)  return { text: `Live · ${elapsed}m in`, cls: 't-live' };
      const h = Math.floor(elapsed / 60);
      const m = elapsed % 60;
      return { text: `Live · ${h}h ${m}m in`, cls: 't-live' };
    }
    if (status === 'upcoming' && start) {
      const mins = Math.round((start - now) / 60000);
      if (mins <= 0)  return { text: 'Starting now', cls: 't-soon' };
      if (mins <= 15) return { text: `Starts in ${mins}m`, cls: 't-soon' };
      if (mins < 60)  return { text: `in ${mins}m`, cls: '' };
      const h = Math.floor(mins / 60);
      return { text: `in ${h}h`, cls: '' };
    }
    if (status === 'ended' && end) {
      const mins = Math.round((now - end) / 60000);
      if (mins < 60)  return { text: `Ended ${mins}m ago`, cls: 't-ended' };
      const h = Math.floor(mins / 60);
      return { text: `Ended ${h}h ago`, cls: 't-ended' };
    }
    return { text: ev?.event?.startsIn || 'Schedule TBA', cls: '' };
  };

  // Status-aware time string used in the card subtitle.
  const formatTimeStatus = (e) => {
    const { startTime, endTime } = extractTimes(e);
    const status = getStatus(e);
    const start = parseTs(startTime);
    const end   = parseTs(endTime);
    const now = new Date();

    if (status === 'live' && start) {
      const elapsed = Math.floor((now - start) / 60000);
      if (elapsed < 1)   return { text: 'Just started', cls: 't-live' };
      if (elapsed < 60)  return { text: `Live · ${elapsed}m in`, cls: 't-live' };
      const h = Math.floor(elapsed / 60);
      const m = elapsed % 60;
      return { text: `Live · ${h}h ${m}m in`, cls: 't-live' };
    }

    if (status === 'starting-soon' && start) {
      const mins = Math.round((start - now) / 60000);
      if (mins <= 0)  return { text: 'Starting now', cls: 't-soon' };
      if (mins === 1) return { text: 'Starts in 1m',  cls: 't-soon' };
      return { text: `Starts in ${mins}m`, cls: 't-soon' };
    }

    if (status === 'upcoming' && start) {
      const mins = Math.round((start - now) / 60000);
      if (mins > 0 && mins < 60) return { text: `in ${mins}m`, cls: '' };
      if (mins >= 60 && mins < 24 * 60) {
        const h = Math.floor(mins / 60);
        return { text: `in ${h}h`, cls: '' };
      }
      return { text: formatTimeShort(start), cls: '' };
    }

    if (status === 'recently-ended' && end) {
      const mins = Math.round((now - end) / 60000);
      if (mins < 1)   return { text: 'Just ended', cls: 't-recent' };
      if (mins === 1) return { text: 'Ended 1m ago', cls: 't-recent' };
      if (mins < 60)  return { text: `Ended ${mins}m ago`, cls: 't-recent' };
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return { text: m ? `Ended ${h}h ${m}m ago` : `Ended ${h}h ago`, cls: 't-recent' };
    }

    if (status === 'ended') {
      if (end)   return { text: `Ended · ${formatTimeShort(end)}`, cls: 't-ended' };
      if (start) return { text: formatTimeShort(start), cls: 't-ended' };
    }

    const range = formatTimeRange(startTime, endTime);
    return { text: range || 'Schedule TBA', cls: '' };
  };

  // Count live events for the topbar pill.
  const countLive = () => {
    const main = (state.events || []).reduce((n, e) => n + (getStatus(e) === 'live' ? 1 : 0), 0);
    const prox = (state.proximityEvents || []).reduce((n, ev) => n + (getProximityStatus(ev) === 'live' ? 1 : 0), 0);
    const fifa = (state.fifaEvents || []).reduce((n, fx) => n + (getFifaStatus(fx) === 'live' ? 1 : 0), 0);
    return main + prox + fifa;
  };

  const typeLabel = (t) => ({
    '0': 'HLS', '1': 'DASH', '2': 'M3U8', '3': 'OTHER'
  }[String(t)] || 'STREAM');

  // ---------- FIFA 2026 Helpers ----------
  const FIFA_STAGE_DURATIONS = {
    'group-stage': 100 * 60 * 1000,
    'round-of-32': 120 * 60 * 1000,
    'round-of-16': 120 * 60 * 1000,
    'quarter-finals': 120 * 60 * 1000,
    'semi-finals': 120 * 60 * 1000,
    'third-place': 120 * 60 * 1000,
    'final': 120 * 60 * 1000,
  };

  const FIFA_STAGE_LABELS = {
    'group-stage': 'Group Stage',
    'round-of-32': 'Round of 32',
    'round-of-16': 'Round of 16',
    'quarter-finals': 'Quarter-finals',
    'semi-finals': 'Semi-finals',
    'third-place': 'Third Place',
    'final': 'Final',
  };

  const getFifaStatus = (fx) => {
    const kickoff = new Date(fx.kickoffUtc);
    const now = Date.now();
    const koMs = kickoff.getTime();
    if (isNaN(koMs)) return 'unknown';
    const dur = FIFA_STAGE_DURATIONS[fx.stage] || 105 * 60 * 1000;
    if (now < koMs) {
      const mins = (koMs - now) / 60000;
      return mins <= 15 ? 'starting-soon' : 'upcoming';
    }
    if (now > koMs + dur) return 'ended';
    return 'live';
  };

  const formatFifaTime = (utcISO) => {
    const d = new Date(utcISO);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString(undefined, {
      month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit', hour12: true
    });
  };

  const formatFifaTimeShort = (d) => {
    if (!d || isNaN(d.getTime())) return '';
    const now = new Date();
    const hh = d.getHours() % 12 || 12;
    const mm = d.getMinutes().toString().padStart(2, '0');
    const ampm = d.getHours() >= 12 ? 'PM' : 'AM';
    const timeStr = `${hh}:${mm} ${ampm}`;
    const sameDay = d.toDateString() === now.toDateString();
    const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
    const isTomorrow = d.toDateString() === tomorrow.toDateString();
    if (sameDay) return `Today ${timeStr}`;
    if (isTomorrow) return `Tomorrow ${timeStr}`;
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ` ${timeStr}`;
  };

  const formatFifaTimeStatus = (fx) => {
    const kickoff = new Date(fx.kickoffUtc);
    const now = new Date();
    const status = getFifaStatus(fx);
    if (status === 'live') {
      const elapsed = Math.floor((now - kickoff) / 60000);
      if (elapsed < 1) return { text: 'Just started', cls: 't-live' };
      if (elapsed < 60) return { text: `Live · ${elapsed}m in`, cls: 't-live' };
      const h = Math.floor(elapsed / 60);
      const m = elapsed % 60;
      return { text: `Live · ${h}h ${m}m in`, cls: 't-live' };
    }
    if (status === 'starting-soon') {
      const mins = Math.round((kickoff - now) / 60000);
      if (mins <= 0) return { text: 'Starting now', cls: 't-soon' };
      return { text: `Starts in ${mins}m`, cls: 't-soon' };
    }
    if (status === 'upcoming') return { text: formatFifaTimeShort(kickoff), cls: '' };
    if (status === 'ended') return { text: 'Ended', cls: 't-ended' };
    return { text: formatFifaTimeShort(kickoff), cls: '' };
  };

  const TEAM_FLAGS = {
    'Mexico':'mx','South Africa':'za','Korea Republic':'kr','Czechia':'cz',
    'Canada':'ca','Bosnia and Herzegovina':'ba','Qatar':'qa','Switzerland':'ch',
    'United States':'us','Paraguay':'py','Australia':'au','Turkiye':'tr',
    'Brazil':'br','Morocco':'ma','Haiti':'ht','Scotland':'gb-sct',
    'Germany':'de',"Cote d'Ivoire":'ci','Ecuador':'ec','Curaçao':'cw',
    'Netherlands':'nl','Japan':'jp','Sweden':'se','Tunisia':'tn',
    'Belgium':'be','IR Iran':'ir','New Zealand':'nz','Egypt':'eg',
    'Spain':'es','Cabo Verde':'cv','Saudi Arabia':'sa','Uruguay':'uy',
    'France':'fr','Senegal':'sn','Iraq':'iq','Norway':'no',
    'Argentina':'ar','Algeria':'dz','Austria':'at','Jordan':'jo',
    'England':'gb-eng','Croatia':'hr','Ghana':'gh','Panama':'pa',
    'Portugal':'pt','Congo DR':'cd','Uzbekistan':'uz','Colombia':'co',
    'Panama':'pa','Croatia':'hr','England':'gb-eng','Ghana':'gh',
  };

  const getFlagUrl = (teamName) => {
    const code = TEAM_FLAGS[teamName];
    if (!code) return '';
    return `https://flagcdn.com/w40/${code}.png`;
  };

  const fifaRowFlag = (teamName) => {
    const url = getFlagUrl(teamName);
    if (!url) return '';
    return `<img src="${escape(url)}" alt="" class="fifa-flag" loading="lazy" onerror="this.style.display='none'"/>`;
  };

  // ---------- API ----------
  async function api(path) {
    const r = await fetch(API + path);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  async function loadEvents() {
    state.error = null;
    state.events = null;
    render();
    try {
      const data = await api('/events-streams');
      state.events = Array.isArray(data) ? data : Array.isArray(data?.value) ? data.value : [];
      // One-time diagnostic so you can verify the timezone parse in DevTools
      if (state.events.length && !window.__ltvp_logged) {
        window.__ltvp_logged = true;
        const tz = -new Date().getTimezoneOffset();
        const tzSign = tz >= 0 ? '+' : '-';
        const tzHH = String(Math.floor(Math.abs(tz) / 60)).padStart(2, '0');
        const tzMM = String(Math.abs(tz) % 60).padStart(2, '0');
        console.log('[LiveTV] Your timezone: UTC' + tzSign + tzHH + ':' + tzMM);
        console.log('[LiveTV] Now (UTC):', new Date().toISOString());
        console.log('[LiveTV] First event RAW keys:', Object.keys(state.events[0]));
        console.log('[LiveTV] First event RAW:', JSON.stringify(state.events[0], null, 2).slice(0, 1500));
        const sample = state.events.slice(0, 3).map(e => {

          return {

            status: getStatus(e),
          };
        });
        console.log('[LiveTV] First events (parsed):', sample);
        // Count statuses across all events
        const counts = state.events.reduce((acc, e) => {
          const s = getStatus(e);
          acc[s] = (acc[s] || 0) + 1;
          return acc;
        }, {});
        console.log('[LiveTV] Status counts:', counts);
      }
    } catch (e) {
      state.error = e.message || 'Failed to load events';

    render();
  }

  async function loadEventDetail(id) {
    state.currentEvent = null;
    state.currentStreams = null;
    state.detailError = null;
    state.detailLoading = true;
    render();
    try {
      const data = await api('/event-streams?id=' + encodeURIComponent(id));
      state.currentStreams = data.streamUrls || [];
      // try to find full event info from cached list
      if (state.events) {
        state.currentEvent = state.events.find(e => String(e.id) === String(id)) || { id, title: 'Event ' + id };
      } else {
        state.currentEvent = { id, title: 'Event ' + id };
      }
    } catch (e) {
      state.detailError = e.message || 'Failed to load event';
    }
    state.detailLoading = false;
    render();
  }

  async function loadProximityDetail(index) {
    const ev = state.proximityEvents?.[index];
    if (!ev || !ev.event) {
      state.detailError = 'Event not found';
      state.detailLoading = false;
      render();
      return;
    }
    const evt = ev.event;
    state.currentEvent = {
      id: 'proximity-' + index,
      title: evt.eventName || 'Proximity Event',
      cat: evt.category,
      eventInfo: {
        eventName: evt.eventName,
        teamA: evt.teamAName,
        teamB: evt.teamBName,
        teamAFlag: evt.teamAFlag,
        teamBFlag: evt.teamBFlag,
        eventBanner: evt.eventLogo,
        startTime: `${evt.date} ${evt.time}`,
        endTime: `${evt.end_date} ${evt.end_time}`
      }
    };
    state.currentStreams = null;
    state.detailError = null;
    state.detailLoading = true;
    render();
    try {
      state.currentStreams = await fetchProximityStreams(evt.links);
    } catch (e) {
      state.detailError = e.message || 'Failed to load streams';
    }
    state.detailLoading = false;
    render();
  }

  async function fetchProximityStreams(linksPath) {
    const r = await fetch(PROXIMITY_API + '/' + linksPath);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    return (Array.isArray(data) ? data : []).map(s => {
      const rawLink = s.link || '';
      const pipeIdx = rawLink.indexOf('|');
      let url = rawLink;
      let headers = {};
      if (pipeIdx !== -1) {
        url = rawLink.substring(0, pipeIdx);
        const headerStr = rawLink.substring(pipeIdx + 1);
        headerStr.split('&').forEach(pair => {
          const eqIdx = pair.indexOf('=');
          if (eqIdx !== -1) {
            try {
              headers[decodeURIComponent(pair.substring(0, eqIdx))] = decodeURIComponent(pair.substring(eqIdx + 1));
            } catch {}
          }
        });
      }
      const type = /\.mpd(\?|$)/i.test(url) ? '1' : (/\.m3u8(\?|$)/i.test(url) ? '0' : '3');
      return {
        title: s.name || 'Stream',
        streamUrl: url,
        link: url,
        type,
        api: s.api || '',
        logo: '',
        headers
      };
    });
  }

  // ---------- Router ----------
  function getRoute() {
    const h = location.hash.replace(/^#\/?/, '');
    if (h.startsWith('event/')) return { name: 'detail', id: h.slice(6) };
    if (h.startsWith('proximity/')) return { name: 'proximity', index: parseInt(h.slice(10), 10) };
    return { name: 'home' };
  }

  function updateTelegramBackButton() {
    if (!tg?.BackButton) return;
    if (getRoute().name === 'detail' || getRoute().name === 'proximity') tg.BackButton.show();
    else tg.BackButton.hide();
  }

  tg?.BackButton?.onClick(() => navigate('#/'));

  window.addEventListener('hashchange', () => {
    const r = getRoute();
    updateTelegramBackButton();
    if (r.name === 'detail') {
      loadEventDetail(r.id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else if (r.name === 'proximity') {
      loadProximityDetail(r.index);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      state.currentEvent = null;
      render();
    }
  });

  // ---------- Render: Home ----------
  function renderHome() {
    const q = state.search.trim().toLowerCase();

    // Section tabs template
    const sectionTabs = `
      <div class="section-tabs" id="sectionTabs">
        <button class="section-tab ${state.section === 'main' ? 'active' : ''}" data-section="main">All Sports</button>
        <button class="section-tab ${state.section === 'willow' ? 'active' : ''}" data-section="willow">Willow Cricket</button>
        <button class="section-tab ${state.section === 'tapmad' ? 'active' : ''}" data-section="tapmad">Tapmad</button>
             <button class="section-tab ${state.section === 'fifa' ? 'active' : ''}" data-section="fifa">FIFA Schedule</button>

      </div>
    `;

    const topbar = `
      <div class="topbar">
        <div class="brand">
          <div class="brand-mark">${ICONS.tv}</div>
          <span class="brand-text">Live Sports</span>
        </div>
        <div class="topbar-actions">
          <span class="live-pill" id="livePill"><span class="dot"></span> <span id="liveCount">0</span> Live</span>
          <span class="clock-pill" id="clockPill" title="Your local time (UTC offset shown for reference)">
            <span id="clockLocal">--:--:--</span>
            <span class="utc" id="clockUtc">UTC--</span>
          </span>

      </div>
    `;

    const searchBar = `
      <div class="search-wrap">

        <input class="search" id="search" type="text" placeholder="Search events, teams, categories…" value="${escape(state.search)}" />
      </div>
    `;

    if (state.section === 'willow') {
      // Willow section
      const wEvents = state.willowEvents || [];
      const willowLive = wEvents.filter(m => m.status === 'LIVE');
      const willowUpcoming = wEvents.filter(m => m.status !== 'LIVE');
      const willowSorted = [...willowLive, ...willowUpcoming];
      const willowFiltered = !q ? willowSorted : willowSorted.filter(m =>
        [m.title, m.synopsis, m.status].filter(Boolean).join(' ').toLowerCase().includes(q)
      );

      app.innerHTML = `
        <div class="page">
          ${topbar}
          ${sectionTabs}
          ${searchBar}
          ${state.willowError ? renderError(state.willowError) :
            !state.willowEvents ? renderLoading() :
            willowFiltered.length === 0 ? renderEmpty('No cricket matches found.') :
            `<div class="grid">${willowFiltered.map(renderWillowCard).join('')}</div>`}
        </div>
      `;
    } else if (state.section === 'tapmad') {
      // Tapmad section
      const tEvents = state.tapmadEvents || [];
      const tapmadLive = tEvents.filter(m => m.Status === 'Live');
      const tapmadUpcoming = tEvents.filter(m => m.Status !== 'Live');
      const tapmadSorted = [...tapmadLive, ...tapmadUpcoming];
      const tapmadFiltered = !q ? tapmadSorted : tapmadSorted.filter(m =>
        [m.VideoName, m.CategoryName, m.StageName, m.Status].filter(Boolean).join(' ').toLowerCase().includes(q)
      );

      app.innerHTML = `
        <div class="page">
          ${topbar}
          ${sectionTabs}
          ${searchBar}
          ${state.tapmadError ? renderError(state.tapmadError) :
            !state.tapmadEvents ? renderLoading() :
            tapmadFiltered.length === 0 ? renderEmpty('No tapmad events found.') :
            `<div class="grid">${tapmadFiltered.map(renderTapmadCard).join('')}</div>`}
        </div>
      `;
    } else if (state.section === 'fifa') {
      // FIFA 2026 section
      const fifaFixtures = state.fifaEvents || [];
      const fifaStages = ['all', 'group-stage', 'round-of-32', 'round-of-16', 'quarter-finals', 'semi-finals', 'third-place', 'final'];
      const filteredFixtures = fifaFixtures.filter(fx => {
        if (state.fifaStage !== 'all' && fx.stage !== state.fifaStage) return false;
        if (!q) return true;
        return [fx.homeTeam, fx.awayTeam, fx.stadium, fx.hostCity, fx.group, FIFA_STAGE_LABELS[fx.stage]]
          .filter(Boolean).join(' ').toLowerCase().includes(q);
      });
      const sortedFixtures = [...filteredFixtures].sort((a, b) => new Date(a.kickoffUtc) - new Date(b.kickoffUtc));

      app.innerHTML = `
        <div class="page">
          ${topbar}
          ${sectionTabs}
          ${searchBar}
          <div class="status-row" id="fifa-stage-chips">
            ${fifaStages.map(s => {
              const label = s === 'all' ? 'All' : (FIFA_STAGE_LABELS[s] || s);
              const count = s === 'all' ? fifaFixtures.length : fifaFixtures.filter(fx => fx.stage === s).length;
              return `<button class="chip ${state.fifaStage === s ? 'active' : ''}" data-fifa-stage="${s}">${label} (${count})</button>`;
            }).join('')}
          </div>
          ${state.fifaError ? renderError(state.fifaError) :
            !state.fifaEvents ? renderLoading() :
            sortedFixtures.length === 0 ? renderEmpty('No FIFA 2026 fixtures found.') :
            `<div class="fifa-table-wrap"><table class="fifa-table">
              <thead><tr>
                <th class="fifa-th-num">#</th>
                <th class="fifa-th-stage">Stage</th>
                <th class="fifa-th-date">Date & Time</th>
                <th class="fifa-th-home">Home</th>
                <th class="fifa-th-vs"></th>
                <th class="fifa-th-away">Away</th>
                <th class="fifa-th-venue">Venue</th>
                <th class="fifa-th-status">Status</th>
              </tr></thead>
              <tbody>${sortedFixtures.map(fx => {
                const status = getFifaStatus(fx);
                const meta = STATUS_META[status] || STATUS_META.unknown;
                const tStatus = formatFifaTimeStatus(fx);
                const stageLabel = FIFA_STAGE_LABELS[fx.stage] || fx.stage;
                const groupLabel = fx.group ? `Grp ${fx.group}` : '';
                const kickoff = new Date(fx.kickoffUtc);
                const dateStr = kickoff.toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZoneName: undefined });
                const timeStr = kickoff.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', hour12: true });
                const isPlaceholder = /^Winner|^Loser|^Group/.test(fx.homeTeam) || /^Winner|^Loser|^Group/.test(fx.awayTeam);
                return `<tr class="fifa-row ${status === 'live' ? 'fifa-row-live' : ''} ${isPlaceholder ? 'fifa-row-tbd' : ''}">
                  <td class="fifa-td-num">${fx.matchNumber}</td>
                  <td class="fifa-td-stage"><span class="fifa-stage-badge">${escape(stageLabel)}</span>${groupLabel ? `<span class="fifa-group-badge">${escape(groupLabel)}</span>` : ''}</td>
                  <td class="fifa-td-date"><span class="fifa-date">${escape(dateStr)}</span><span class="fifa-time">${escape(timeStr)}</span></td>
                  <td class="fifa-td-home">${fifaRowFlag(fx.homeTeam)}<span class="fifa-team-name">${escape(fx.homeTeam)}</span></td>
                  <td class="fifa-td-vs">vs</td>
                  <td class="fifa-td-away">${fifaRowFlag(fx.awayTeam)}<span class="fifa-team-name">${escape(fx.awayTeam)}</span></td>
                  <td class="fifa-td-venue">${escape(fx.stadium || '')}${fx.hostCity ? '<br><small>' + escape(fx.hostCity) + '</small>' : ''}</td>
                  <td class="fifa-td-status"><span class="fifa-status-pill ${escape(meta.cls || '')}">${status === 'live' ? '<span class="dot"></span>' : ''}${escape(meta.label || '')}</span><span class="${escape(tStatus.cls || '')}">${escape(tStatus.text)}</span></td>
                </tr>`;
              }).join('')}</tbody>
            </table></div>`}
        </div>
      `;

      // Bind FIFA stage chips
      document.querySelectorAll('#fifa-stage-chips .chip').forEach(c => {
        c.addEventListener('click', () => {
          state.fifaStage = c.dataset.fifaStage;
          renderHome();
        });
      });
    } else {
      // Main events section — merged with Proximity events
      const mainEvs = (state.events || []);
      const proxEvs = (state.proximityEvents || []).filter(ev => ev.event && ev.event.visible !== false);

      // Build unified list: { src:'main'|'proximity', data, status, startTime }
      const statusPriority = { 'live': 0, 'starting-soon': 1, 'upcoming': 2, 'recently-ended': 3, 'ended': 4, 'unknown': 5 };

      const unified = [];
      mainEvs.forEach(e => {
        const s = getStatus(e);
        const t = parseTs(extractTimes(e).startTime)?.getTime() ?? 0;
        unified.push({ src: 'main', data: e, status: s, startTime: t });
      });
      proxEvs.forEach(ev => {
        const s = getProximityStatus(ev);
        const t = getProximityStartTime(ev)?.getTime() ?? 0;
        unified.push({ src: 'proximity', data: ev, status: s, startTime: t });
      });

      unified.sort((a, b) => {
        if (statusPriority[a.status] !== statusPriority[b.status]) return statusPriority[a.status] - statusPriority[b.status];
        if (a.status === 'upcoming' || a.status === 'starting-soon') return a.startTime - b.startTime;
        return b.startTime - a.startTime;
      });

      // Categories from both sources
      const mainCats = mainEvs.map(e => e.cat).filter(Boolean);
      const proxCats = proxEvs.map(ev => ev.event?.category).filter(Boolean);
      const cats = ['All', ...new Set([...mainCats, ...proxCats])].sort((a, b) => a === 'All' ? -1 : b === 'All' ? 1 : a.localeCompare(b));

      const filtered = unified.filter(item => {
        if (item.src === 'main') {
          if (state.category !== 'All' && item.data.cat !== state.category) return false;
        } else {
          if (state.category !== 'All' && item.data.event?.category !== state.category) return false;
        }
        if (state.status !== 'all' && statusBucket(item.status) !== state.status) return false;
        if (!q) return true;
        if (item.src === 'main') {
          return [cleanTitle(item.data.title), item.data.cat, item.data.eventInfo?.eventName, item.data.eventInfo?.teamA, item.data.eventInfo?.teamB]
            .filter(Boolean).join(' ').toLowerCase().includes(q);
        } else {
          const e = item.data.event;
          return [e.eventName, e.category, e.teamAName, e.teamBName].filter(Boolean).join(' ').toLowerCase().includes(q);
        }
      });

      // Status counts from both sources
      const statusCounts = unified.reduce((acc, item) => {
        const b = statusBucket(item.status);
        acc[b] = (acc[b] || 0) + 1;
        return acc;
      }, {});

      const totalCount = unified.length;

      app.innerHTML = `
        <div class="page">
          ${topbar}
          ${sectionTabs}
          ${searchBar}

          <div class="status-row" id="status-chips">
            <button class="chip ${state.status === 'all' ? 'active' : ''}" data-status="all">All (${totalCount})</button>
            <button class="chip ${state.status === 'live' ? 'active' : ''}" data-status="live">🔴 Live (${statusCounts.live || 0})</button>
            <button class="chip ${state.status === 'upcoming' ? 'active' : ''}" data-status="upcoming">⏰ Upcoming (${statusCounts.upcoming || 0})</button>
            <button class="chip ${state.status === 'ended' ? 'active' : ''}" data-status="ended">⏹ Ended (${statusCounts.ended || 0})</button>
          </div>

          <div class="filter-chips" id="chips">
            ${cats.map(c => `<button class="chip ${c === state.category ? 'active' : ''}" data-cat="${escape(c)}">${escape(c)}</button>`).join('')}
          </div>

          ${((state.error || state.proximityError) && filtered.length === 0) ? renderError(state.error || state.proximityError) :
            (!state.events && !state.proximityEvents) ? renderLoading() :
            filtered.length === 0 ? renderEmpty() :
            `<div class="grid">${filtered.map(item => {
              if (item.src === 'main') return renderEventCard(item.data);
              return renderProximityCard(item.data, state.proximityEvents.indexOf(item.data));
            }).join('')}</div>`}
        </div>
      `;

      // Update the live-pill count
      const liveCountEl = document.getElementById('liveCount');
      if (liveCountEl) liveCountEl.textContent = statusCounts.live || 0;
    }

    // Start (or refresh) the live clock
    startClock();

    bindHomeEvents();
  }

  // ---------- Live clock ----------
  let _clockTimer = null;
  let _statusTimer = null;
  function startClock() {
    const tickClock = () => {
      const localEl = document.getElementById('clockLocal');
      const utcEl   = document.getElementById('clockUtc');
      if (localEl) {
        localEl.textContent = new Date().toLocaleTimeString('en-US', {
          hour12: true,
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
      }
      if (utcEl) {
        const off = -new Date().getTimezoneOffset(); // minutes east of UTC
        const sign = off >= 0 ? '+' : '-';
        const a = Math.abs(off);
        const hh = String(Math.floor(a / 60)).padStart(2, '0');
        const mm = String(a % 60).padStart(2, '0');
        utcEl.textContent = `UTC${sign}${hh}:${mm}`;
      }
    };
    tickClock();
    if (_clockTimer) clearInterval(_clockTimer);
    _clockTimer = setInterval(tickClock, 1000);

    // Re-render every 30s so countdowns and live/recent status stay fresh
    // without hammering the API.
    if (_statusTimer) clearInterval(_statusTimer);
    _statusTimer = setInterval(() => {
      if ((state.events || state.proximityEvents || state.fifaEvents) && getRoute().name === 'home') {
        // Update live count in topbar
        const liveCountEl = document.getElementById('liveCount');
        if (liveCountEl) liveCountEl.textContent = countLive();
        // Update status chip counts from both sources
        const allItems = [
          ...(state.events || []).map(e => ({ status: getStatus(e) })),
          ...(state.proximityEvents || []).map(ev => ({ status: getProximityStatus(ev) }))
        ];
        const counts = allItems.reduce((acc, item) => {
          const b = statusBucket(item.status);
          acc[b] = (acc[b] || 0) + 1;
          return acc;
        }, {});
        const update = (sel, n) => {
          const btn = document.querySelector(sel);
          if (btn) {
            const label = btn.textContent.replace(/\s*\(\d+\)\s*$/, '');
            btn.textContent = `${label} (${n || 0})`;
          }
        };
        update('#status-chips [data-status="all"]',      allItems.length);
        update('#status-chips [data-status="live"]',     counts.live);
        update('#status-chips [data-status="upcoming"]',  counts.upcoming);
        update('#status-chips [data-status="ended"]',     counts.ended);
        // Re-render the grid so badges and countdowns update
        renderHome();
      }
    }, 30_000);
  }

  function bindHomeEvents() {
    $('#refresh')?.addEventListener('click', loadEvents);
    const s = $('#search');
    if (s) {
      s.addEventListener('input', (e) => {
        state.search = e.target.value;
        renderHome();
      });
    }
    // Section tabs
    document.querySelectorAll('#sectionTabs .section-tab').forEach(t => {
      t.addEventListener('click', () => {
        state.section = t.dataset.section;
        renderHome();
      });
    });
    // Status chips (Live / Upcoming / Ended / All)
    document.querySelectorAll('#status-chips .chip').forEach(c => {
      c.addEventListener('click', () => {
        state.status = c.dataset.status;
        renderHome();
      });
    });
    // Category chips
    document.querySelectorAll('#chips .chip').forEach(c => {
      c.addEventListener('click', () => {
        state.category = c.dataset.cat;
        renderHome();
      });
    });
    // Main event cards
    document.querySelectorAll('.event-card:not(.willow-card):not(.tapmad-card)').forEach(c => {
      c.addEventListener('click', () => navigate('#/event/' + c.dataset.id));
    });
    // Willow cards & play buttons
    document.querySelectorAll('.willow-card').forEach(c => {
      c.addEventListener('click', () => {
        try {
          const streamUrl = c.dataset.streamUrl;
          const drmKey = c.dataset.drmKey;
          const title = c.querySelector('.event-title')?.textContent || 'Willow Cricket';
          if (streamUrl) {
            const drm = parseDrmKey(drmKey);
            console.log('[Willow] Playing:', { title, streamUrl, drm });
            openPlayer({
              streams: [{ title, streamUrl, link: streamUrl, type: '1', api: drm ? JSON.stringify(drm) : '' }],
              startIndex: 0,
              title
            });
          } else {
            const url = c.dataset.url;
            if (url) window.open(url, '_blank', 'noopener');
          }
        } catch (e) { console.error('[Willow] Card click error:', e); }
      });
    });
    document.querySelectorAll('[data-willow-play]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        try {
          const card = btn.closest('.willow-card');
          if (!card) return;
          const streamUrl = card.dataset.streamUrl;
          const drmKey = card.dataset.drmKey;
          const title = card.querySelector('.event-title')?.textContent || 'Willow Cricket';
          if (streamUrl) {
            const drm = parseDrmKey(drmKey);
            console.log('[Willow] Play btn:', { title, streamUrl, drm });
            openPlayer({
              streams: [{ title, streamUrl, link: streamUrl, type: '1', api: drm ? JSON.stringify(drm) : '' }],
              startIndex: 0,
              title
            });
          }
        } catch (e) { console.error('[Willow] Play btn error:', e); }
      });
    });
    // Tapmad cards & play buttons
    document.querySelectorAll('.tapmad-card').forEach(c => {
      c.addEventListener('click', () => {
        try {
          const streamUrl = c.dataset.streamUrl;
          const title = c.querySelector('.event-title')?.textContent || 'Tapmad Event';
          if (streamUrl) {
            console.log('[Tapmad] Playing:', { title, streamUrl });
            openPlayer({
              streams: [{ title, streamUrl, link: streamUrl, type: '0' }],
              startIndex: 0,
              title
            });
          }
        } catch (e) { console.error('[Tapmad] Card click error:', e); }
      });
    });
    document.querySelectorAll('[data-tapmad-play]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        try {
          const card = btn.closest('.tapmad-card');
          if (!card) return;
          const streamUrl = card.dataset.streamUrl;
          const title = card.querySelector('.event-title')?.textContent || 'Tapmad Event';
          if (streamUrl) {
            console.log('[Tapmad] Playing:', { title, streamUrl });
            openPlayer({
              streams: [{ title, streamUrl, link: streamUrl, type: '0' }],
              startIndex: 0,
              title
            });
          }
        } catch (e) { console.error('[Tapmad] Play btn error:', e); }
      });
    });
    // Proximity cards
    document.querySelectorAll('.proximity-card').forEach(c => {
      c.addEventListener('click', () => {
        const idx = parseInt(c.dataset.proximityIndex, 10);
        if (!isNaN(idx)) navigate('#/proximity/' + idx);
      });
    });
  }

  function renderEventCard(e) {
    const info = e.eventInfo || {};
    const banner = info.eventBanner;
    const status = getStatus(e);
    const meta = STATUS_META[status] || STATUS_META.unknown;
    const tStatus = formatTimeStatus(e);
    const formatsCount = (e.streamUrls || e.formats || []).length;

    return `
      <article class="event-card" data-id="${e.id}">
        <div class="event-banner">
          ${banner ? `<img src="${escape(banner)}" alt="" loading="lazy" onerror="this.style.display='none'"/>` : ''}
          <div class="event-banner-fallback">${escape((e.title || 'LIVE').slice(0, 2).toUpperCase())}</div>
          <div class="event-card-overlay"></div>
          ${e.cat ? `<span class="cat-badge">${escape(e.cat)}</span>` : ''}
          ${meta.label ? `<span class="status-badge ${meta.cls}">${status === 'live' ? '<span class="dot"></span>' : ''}${escape(meta.label)}</span>` : ''}
          ${formatsCount ? `<span class="formats-count">${formatsCount} sources</span>` : ''}
        </div>

  function renderPlayAction(stream) {
    const url = stream.streamUrl || stream.link || '';
    if (!url) return '';
    const streamId = 's' + state.streamMap.size;
    state.streamMap.set(streamId, stream);
    return `
      <div class="stream-actions">

          class="stream-play"

          Play
        </button>
      </div>
    `;
  }

  function hostOf(url) {
    try { return new URL(url).host; } catch { return url.slice(0, 40); }
  }

  function streamFileType(url, type) {
    if (/\.m3u8(\?|$)/i.test(url) || String(type) === '0' || String(type) === '2') return 'hls';
    if (/\.mpd(\?|$)/i.test(url) || String(type) === '1') return 'dash';
    return undefined;
  }

  function parseDrmKey(value) {
    const raw = String(value || '').trim();
    if (!raw) return null;

    try {
      const data = JSON.parse(raw);
      const keyId = data.keyId || data.kid || data.key_id || data.KID;
      const key = data.key || data.k || data.value || data.KEY;
      if (keyId && key) return { keyId: normalizeHexKey(keyId), key: normalizeHexKey(key) };
    } catch {}

    const keyIdMatch = raw.match(/(?:keyId|key_id|kid)\s*[:=]\s*["']?([a-f0-9-]{16,})/i);
    const keyMatch = raw.match(/(?:^|[,&\s|])(?:key|k)\s*[:=]\s*["']?([a-f0-9-]{16,})/i);
    if (keyIdMatch && keyMatch) {
      return {
        keyId: normalizeHexKey(keyIdMatch[1]),
        key: normalizeHexKey(keyMatch[1])
      };
    }

    const parts = raw
      .replace(/[{}"]/g, '')
      .split(/[,:=\s|]+/)
      .map(part => normalizeHexKey(part))
      .filter(part => /^[a-f0-9]{16,}$/.test(part));

    if (parts.length >= 2) return { keyId: parts[0], key: parts[1] };
    return null;
  }

  function normalizeHexKey(value) {
    return String(value || '').trim().replace(/^0x/i, '').replace(/-/g, '').toLowerCase();
  }

  function closePlayer() {
    clearTimeout(playbackSetupTimer);
    playbackQueue = [];
    playbackIndex = 0;
    playbackTitle = '';
    try { window.jwplayer?.('jwPlayer')?.remove?.(); } catch {}
    playerModal?.classList.remove('open');
    if (playerTitle) playerTitle.textContent = 'Player';
    if (playerStreamInfo) playerStreamInfo.style.display = 'none';
    if (playerPrevBtn) playerPrevBtn.classList.remove('visible');
    if (playerNextBtn) playerNextBtn.classList.remove('visible');
  }

  function openPlayer({ streams, startIndex, title }) {
    if (!Array.isArray(streams) || streams.length === 0) {
      showToast('No stream URL found');
      return;
    }

    playbackQueue = streams;
    playbackIndex = Math.max(0, Math.min(startIndex || 0, streams.length - 1));
    playbackTitle = cleanTitle(title) || 'Player';
    playerModal.classList.add('open');
    playCurrentInQueue();
  }

  function playCurrentInQueue() {
    clearTimeout(playbackSetupTimer);

    if (playbackIndex >= playbackQueue.length) {
      document.getElementById('jwPlayer').innerHTML = `
        <div class="player-message">
          All ${playbackQueue.length} source${playbackQueue.length === 1 ? '' : 's'} failed to play.
          <br><button class="glass-btn" id="playerRetry" type="button" style="margin-top:14px">${ICONS.refresh} Retry from first</button>
        </div>
      `;
      document.getElementById('playerRetry')?.addEventListener('click', () => {
        playbackIndex = 0;
        playCurrentInQueue();
      });
      return;
    }

    const stream = playbackQueue[playbackIndex];
    const url = stream.streamUrl || stream.link || '';
    const type = stream.type ?? '0';
    const drmKey = parseDrmKey(stream.api || '');

    try { window.jwplayer?.('jwPlayer')?.remove?.(); } catch {}

    if (!url) {
      showToast(`Source ${playbackIndex + 1} has no URL, skipping`);
      playbackIndex++;
      playCurrentInQueue();
      return;
    }

    if (!window.jwplayer) {
      document.getElementById('jwPlayer').innerHTML = `
        <div class="player-message">JW Player failed to load. Check the library URL or network access.</div>
      `;
      return;
    }

    const multi = playbackQueue.length > 1;
    playerTitle.textContent = multi
      ? `${playbackTitle} · source ${playbackIndex + 1}/${playbackQueue.length}`
      : playbackTitle;
    if (playerStreamInfo) {
      playerStreamInfo.textContent = multi ? `${playbackIndex + 1} / ${playbackQueue.length}` : '';
      playerStreamInfo.style.display = multi ? '' : 'none';
    }
    if (playerPrevBtn) {
      playerPrevBtn.classList.toggle('visible', multi);
      playerPrevBtn.disabled = playbackIndex === 0;
    }
    if (playerNextBtn) {
      playerNextBtn.classList.toggle('visible', multi);
      playerNextBtn.disabled = playbackIndex === playbackQueue.length - 1;
    }

    const fileType = streamFileType(url, type);
    const source = {
      file: url,
      type: fileType
    };

    if (fileType === 'dash' && drmKey?.keyId && drmKey?.key) {
      source.drm = { clearkey: { keyId: drmKey.keyId, key: drmKey.key } };
    }

    let player;
    try {
      player = window.jwplayer('jwPlayer').setup({
        playlist: [source],
        width: '100%',
        height: '100%',
        autostart: true,
        controls: true,
        displaytitle: false,
        displaydescription: false,
        stretching: 'uniform',
        mute: false,
        primary: 'html5',
        skin: { name: 'storm' },
        logo: { hide: false, position: 'top-right' }
      });
    } catch (e) {
      document.getElementById('jwPlayer').innerHTML = `
        <div class="player-message">${escape(e.message || 'Unable to start player.')}</div>
      `;
      return;
    }

    // 15s setup timeout — fires if the stream never starts playing
    playbackSetupTimer = setTimeout(() => {
      if (playbackIndex >= playbackQueue.length) return;
      console.warn(`[Player] Setup timeout on source ${playbackIndex + 1}/${playbackQueue.length}`);
      showToast(`Source ${playbackIndex + 1} timed out, trying next…`);
      try { window.jwplayer?.('jwPlayer')?.remove?.(); } catch {}
      playbackIndex++;
      playCurrentInQueue();
    }, 30000);

    const advance = (reason) => {
      if (playbackIndex >= playbackQueue.length) return;
      console.warn(`[Player] ${reason} on source ${playbackIndex + 1}/${playbackQueue.length}`);
      showToast(playbackIndex < playbackQueue.length - 1
        ? `Source ${playbackIndex + 1} failed, trying next…`
        : `Source ${playbackIndex + 1} failed`);
      clearTimeout(playbackSetupTimer);
      try { window.jwplayer?.('jwPlayer')?.remove?.(); } catch {}
      playbackIndex++;
      playCurrentInQueue();
    };

    player.on?.('play', () => clearTimeout(playbackSetupTimer));
    player.on?.('error', () => advance('Error'));
    player.on?.('setupError', () => advance('Setup error'));
  }

  function nextStream() {
    if (!playbackQueue.length) return;
    if (playbackIndex >= playbackQueue.length - 1) {
      showToast('No more sources');
      return;
    }
    clearTimeout(playbackSetupTimer);
    try { window.jwplayer?.('jwPlayer')?.remove?.(); } catch {}
    playbackIndex++;
    playCurrentInQueue();
  }

  function prevStream() {
    if (!playbackQueue.length) return;
    if (playbackIndex <= 0) {
      showToast('Already on first source');
      return;
    }
    clearTimeout(playbackSetupTimer);
    try { window.jwplayer?.('jwPlayer')?.remove?.(); } catch {}
    playbackIndex--;
    playCurrentInQueue();
  }

  function bindStreamActions() {
    document.querySelectorAll('.stream-item').forEach(item => {
      const head = item.querySelector('[data-toggle]');
      head?.addEventListener('click', (e) => {
        if (e.target.closest('.field-copy, [data-play], [data-unlock]')) return;
        item.classList.toggle('open');
      });
    });
    document.querySelectorAll('[data-play]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const stream = state.streamMap.get(btn.dataset.streamId);
        if (!stream) {
          showToast('Stream not found');
          return;
        }
        const allStreams = (state.currentStreams && state.currentStreams.length)
          ? state.currentStreams
          : [stream];
        const startIndex = allStreams.indexOf(stream);
        const eventTitle = state.currentEvent
          ? cleanTitle(state.currentEvent.title)
          : (cleanTitle(stream.title) || 'Player');
        openPlayer({
          streams: allStreams,
          startIndex: startIndex >= 0 ? startIndex : 0,
          title: eventTitle
        });
      });
    });
    document.querySelectorAll('[data-unlock]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        window.location.href = UNLOCK_URL;
      });
    });
    document.querySelectorAll('.field-copy').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const val = btn.dataset.copy || '';
        const ok = await copyText(val);
        if (ok) {
          btn.classList.add('copied');
          btn.innerHTML = ICONS.check;
          setTimeout(() => {
            btn.classList.remove('copied');
            btn.innerHTML = ICONS.copy;
          }, 1400);
          showToast('Copied');
        } else {
          showToast('Copy failed');
        }
      });
    });
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        return ok;
      } catch { return false; }
    }
  }

  playerClose?.addEventListener('click', closePlayer);
  playerPrevBtn?.addEventListener('click', prevStream);
  playerNextBtn?.addEventListener('click', nextStream);
  playerModal?.addEventListener('click', (e) => {
    if (e.target === playerModal) closePlayer();
  });
  document.addEventListener('keydown', (e) => {
    if (!playerModal?.classList.contains('open')) return;
    if (e.key === 'Escape') closePlayer();
    else if (e.key === 'ArrowRight' && playbackQueue.length > 1) nextStream();
    else if (e.key === 'ArrowLeft' && playbackQueue.length > 1) prevStream();
  });

  // ---------- Render helpers ----------
  function renderLoading() {
    return `<div class="state"><div class="spinner"></div><h3>Loading events…</h3><p>Fetching the latest live schedule</p></div>`;
  }
  function renderError(msg) {
    return `
      <div class="state">
        <div class="state-icon">${ICONS.sad}</div>
        <h3>Something went wrong</h3>
        <p>${escape(msg)}</p>
        <p style="margin-top:14px;font-size:12px;color:var(--text-faint)">
          Tip: serve this file via a local HTTP server (e.g. <code>python -m http.server</code>) for browser CORS to work.
        </p>
        <button class="glass-btn" style="margin-top:18px" onclick="location.reload()">${ICONS.refresh} Retry</button>
      </div>`;
  }
  function renderEmpty(msg) {
    return `<div class="state"><div class="state-icon">${ICONS.search}</div><h3>No events found</h3><p>${escape(msg || 'Try a different search or category.')}</p></div>`;
  }

  // ---------- Render dispatcher ----------
  function render() {
    const r = getRoute();
    updateTelegramBackButton();
    if (r.name === 'detail') renderDetail();
    else if (r.name === 'proximity') renderDetail();
    else renderHome();
  }

  // ---------- Boot ----------
  (async function init() {
    if (location.hash.startsWith('#/event/')) {
      await loadEventDetail(getRoute().id);
    } else if (location.hash.startsWith('#/proximity/')) {
      await Promise.all([loadProximityEvents()]);
      await loadProximityDetail(getRoute().index);
    } else {
      await Promise.all([loadEvents(), loadWillowEvents(), loadTapmadEvents(), loadProximityEvents(), loadFifaEvents()]);
    }
  })();
})();
</script>

</body>
</html>
